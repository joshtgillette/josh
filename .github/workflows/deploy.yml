name: Deploy
on:
  push:
    branches: [prod]
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key && chmod 600 key
          ssh -i key -o StrictHostKeyChecking=no root@5.161.122.7 "
            cd /opt/josh && git stash && git pull --rebase && npm install && npm run build &&
            cd /opt/caddy && docker compose up -d --build josh-views
          "
          rm key
